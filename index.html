<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepApp | Auxiliar Málaga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="preguntas.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    <div id="app" class="max-w-xl mx-auto p-4 py-8">
        
        <div id="loader" class="text-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
            <p class="mt-4 text-slate-500 font-medium">Cargando base de datos...</p>
        </div>

        <div id="main-content" class="hidden">
            <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div>
                    <h1 class="font-black text-indigo-600 leading-none">AUX. ADVO MÁLAGA</h1>
                    <p id="stats" class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter mt-1"></p>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleReview()" id="rev-btn" class="bg-slate-100 text-slate-500 text-[10px] font-bold px-3 py-1 rounded-full hover:bg-indigo-100 transition">REPASO: OFF</button>
                    <div class="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-xs font-bold">🔥 <span id="streak">0</span></div>
                </div>
            </div>

            <div class="mb-6">
                <div class="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
                    <div id="bar" class="h-full bg-indigo-500 transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div id="card" class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden mb-6 animate__animated animate__fadeIn">
                <div class="p-6 md:p-8">
                    <div class="flex items-start gap-3 mb-3">
                        <span id="q-number" class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-indigo-600 text-white font-bold text-sm"></span>
                        <h2 id="q-text" class="text-lg font-semibold text-slate-800 leading-snug flex-1"></h2>
                    </div>
                </div>
                <div id="options" class="p-4 bg-slate-50/50 grid gap-3"></div>
            </div>

            <div class="flex justify-between items-center px-2">
                <button onclick="prev()" class="text-xs font-bold text-slate-400 hover:text-slate-600 uppercase transition">Anterior</button>
                <button onclick="next()" class="bg-slate-900 text-white px-10 py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-600 active:scale-95 transition-all">Siguiente</button>
            </div>
        </div>
    </div>

    <script>
        // ELIMINADO: let db = [];  <-- Esto causaba el error de "already declared"
        
        let currentIdx = 0;
        let isReview = false;
        let streak = 0;
        let fails = JSON.parse(localStorage.getItem('malaga_fails') || '[]');

        function iniciarApp() {
            // Comprobamos si 'db' existe (viene de preguntas.js)
            if (typeof db !== 'undefined') {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                render(); 
            } else {
                alert("Error: No se detecta 'db' en preguntas.js. Asegúrate de que el archivo empieza con 'const db = [...]'");
            }
        }

        // Ejecutar al cargar la ventana
        window.addEventListener('load', iniciarApp);

        function render() {
            const list = isReview ? db.filter(q => fails.includes(q.id)) : db;
            const statsEl = document.getElementById('stats');
            const container = document.getElementById('options');
            const qText = document.getElementById('q-text');
            const qNumber = document.getElementById('q-number');

            if (list.length === 0) {
                qText.innerText = isReview ? "¡Felicidades! No tienes preguntas pendientes de repaso." : "Cargando preguntas...";
                qNumber.innerText = "";
                container.innerHTML = "";
                statsEl.innerText = "0 PREGUNTAS";
                return;
            }

            // Asegurar que el índice no se salga de rango si la lista de fallos cambia
            if (currentIdx >= list.length) currentIdx = 0;

            const q = list[currentIdx];
            qText.innerText = q.q;
            qNumber.innerText = q.id;
            statsEl.innerText = `Pregunta ${currentIdx + 1} de ${list.length} ${isReview ? '(MODO REPASO)' : ''}`;
            
            container.innerHTML = '';
            ['a', 'b', 'c', 'd'].forEach(l => {
                if(!q[l]) return; // Por si alguna pregunta solo tiene 3 opciones
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 bg-white hover:border-indigo-300 transition-all flex gap-4 items-center group active:bg-slate-50";
                btn.innerHTML = `
                    <span class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-lg bg-slate-100 text-slate-500 group-hover:bg-indigo-100 font-bold text-sm uppercase">${l}</span>
                    <span class="text-slate-600 text-sm font-medium">${q[l]}</span>
                `;
                btn.onclick = () => check(l, q.correct, q.id, btn);
                container.appendChild(btn);
            });

            document.getElementById('bar').style.width = `${((currentIdx + 1) / list.length) * 100}%`;
        }

        function check(opt, correct, id, btn) {
            const btns = document.querySelectorAll('#options button');
            btns.forEach(b => b.onclick = null); // Bloquear clics extra

            if(opt === correct) {
                btn.classList.replace('border-slate-200', 'border-green-500');
                btn.classList.add('bg-green-50');
                streak++;
                // Si acertamos en modo repaso, quitar de la lista de fallos
                if(isReview) fails = fails.filter(f => f !== id);
            } else {
                btn.classList.replace('border-slate-200', 'border-red-500');
                btn.classList.add('bg-red-50');
                streak = 0;
                if(!fails.includes(id)) fails.push(id);
                
                // Mostrar la correcta
                btns.forEach(b => {
                    const letra = b.querySelector('span').innerText.toLowerCase();
                    if(letra === correct) {
                        b.classList.replace('border-slate-200', 'border-green-500');
                        b.classList.add('bg-green-50');
                    }
                });
            }
            
            localStorage.setItem('malaga_fails', JSON.stringify(fails));
            document.getElementById('streak').innerText = streak;
        }

        function toggleReview() {
            isReview = !isReview;
            currentIdx = 0;
            const btn = document.getElementById('rev-btn');
            btn.innerText = isReview ? "REPASO: ON" : "REPASO: OFF";
            btn.classList.toggle('bg-indigo-600');
            btn.classList.toggle('text-white');
            btn.classList.toggle('bg-slate-100');
            btn.classList.toggle('text-slate-500');
            render();
        }

        function next() { 
            const list = isReview ? db.filter(q => fails.includes(q.id)) : db;
            if(currentIdx < list.length - 1) {
                currentIdx++; 
            } else {
                currentIdx = 0; // Volver al inicio
            }
            render(); 
        }

        function prev() { 
            if(currentIdx > 0) {
                currentIdx--; 
                render(); 
            }
        }
    </script>
</body>
</html>
