<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepApp | Auxiliar Málaga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="preguntas.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    <div id="app" class="max-w-xl mx-auto p-4 py-8">
        
        <div id="loader" class="text-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
            <p class="mt-4 text-slate-500 font-medium">Cargando base de datos...</p>
        </div>

        <div id="main-content" class="hidden">
            <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div>
                    <h1 class="font-black text-indigo-600 leading-none">AUX. ADVO MÁLAGA</h1>
                    <p id="stats" class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter mt-1"></p>
                </div>
                <div class="flex gap-2 flex-wrap justify-end">
                    <button onclick="openTemaConfig()" id="config-btn" class="bg-slate-100 text-slate-500 text-[10px] font-bold px-3 py-1 rounded-full hover:bg-green-100 transition">⚙️ TEMAS</button>
                    <button onclick="toggleOrder()" id="order-btn" class="bg-slate-100 text-slate-500 text-[10px] font-bold px-3 py-1 rounded-full hover:bg-blue-100 transition">📋 ORDEN</button>
                    <button onclick="toggleReview()" id="rev-btn" class="bg-slate-100 text-slate-500 text-[10px] font-bold px-3 py-1 rounded-full hover:bg-indigo-100 transition">REPASO: OFF</button>
                    <div class="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-xs font-bold">🔥 <span id="streak">0</span></div>
                </div>
            </div>

            <div class="mb-6">
                <div class="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
                    <div id="bar" class="h-full bg-indigo-500 transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div id="card" class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden mb-6 animate__animated animate__fadeIn">
                <div class="p-6 md:p-8">
                    <div class="flex items-start gap-3 mb-3">
                        <span id="q-number" class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-indigo-600 text-white font-bold text-sm"></span>
                        <h2 id="q-text" class="text-lg font-semibold text-slate-800 leading-snug flex-1"></h2>
                    </div>
                    <p id="q-tema" class="text-xs text-slate-500 font-medium px-0 mb-2"></p>
                </div>
                <div id="options" class="p-4 bg-slate-50/50 grid gap-3"></div>
            </div>

            <div class="flex justify-between items-center px-2">
                <button onclick="prev()" class="text-xs font-bold text-slate-400 hover:text-slate-600 uppercase transition">Anterior</button>
                <button onclick="next()" class="bg-slate-900 text-white px-10 py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-600 active:scale-95 transition-all">Siguiente</button>
            </div>

            <!-- Modal de Configuración de Temas -->
            <div id="tema-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 animate__animated animate__fadeIn">
                    <h2 class="text-xl font-bold text-slate-800 mb-4">Selecciona temas a repasar</h2>
                    
                    <div class="mb-4 flex gap-2">
                        <button onclick="selectAllTemas()" class="flex-1 bg-indigo-100 text-indigo-600 text-sm font-bold px-3 py-2 rounded-lg hover:bg-indigo-200 transition">Todos</button>
                        <button onclick="deselectAllTemas()" class="flex-1 bg-slate-100 text-slate-600 text-sm font-bold px-3 py-2 rounded-lg hover:bg-slate-200 transition">Ninguno</button>
                    </div>

                    <div id="tema-list" class="max-h-80 overflow-y-auto space-y-2 mb-6">
                        <!-- Se llenará con JavaScript -->
                    </div>

                    <div class="flex gap-2">
                        <button onclick="closeTemaConfig()" class="flex-1 bg-slate-100 text-slate-600 font-bold px-4 py-2 rounded-lg hover:bg-slate-200 transition">Cancelar</button>
                        <button onclick="applyTemaFilter()" class="flex-1 bg-indigo-600 text-white font-bold px-4 py-2 rounded-lg hover:bg-indigo-700 transition">Aplicar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ELIMINADO: let db = [];  <-- Esto causaba el error de "already declared"
        
        let currentIdx = 0;
        let isReview = false;
        let isRandomOrder = false;
        let randomList = [];
        let streak = 0;
        let fails = JSON.parse(localStorage.getItem('malaga_fails') || '[]');
        let selectedTemas = JSON.parse(localStorage.getItem('malaga_selected_temas') || 'null');
        let temaFilter = null; // null = todos los temas, [] = filtro activo

        function iniciarApp() {
            // Comprobamos si 'db' existe (viene de preguntas.js)
            if (typeof db !== 'undefined') {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                buildTemaList();
                // Restaurar filtro anterior si existe
                if (selectedTemas) {
                    temaFilter = selectedTemas;
                    updateTemaConfigUI();
                }
                render(); 
            } else {
                alert("Error: No se detecta 'db' en preguntas.js. Asegúrate de que el archivo empieza con 'const db = [...]'");
            }
        }

        // Ejecutar al cargar la ventana
        window.addEventListener('load', iniciarApp);

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function render() {
            let list = db;
            
            // Aplicar filtro de temas
            if (temaFilter !== null) {
                list = list.filter(q => temaFilter.includes(q.tema));
            }
            
            // Aplicar filtro de repaso
            if (isReview) {
                list = list.filter(q => fails.includes(q.id));
            }
            
            if (isRandomOrder) {
                if (!randomList.length || randomList.length !== list.length) {
                    randomList = shuffleArray(list);
                }
                list = randomList;
            } else {
                randomList = [];
            }

            const statsEl = document.getElementById('stats');
            const container = document.getElementById('options');
            const qText = document.getElementById('q-text');
            const qNumber = document.getElementById('q-number');
            const qTema = document.getElementById('q-tema');

            if (list.length === 0) {
                qText.innerText = isReview ? "¡Felicidades! No tienes preguntas pendientes de repaso." : "Cargando preguntas...";
                qNumber.innerText = "";
                qTema.innerText = "";
                container.innerHTML = "";
                statsEl.innerText = "0 PREGUNTAS";
                return;
            }

            // Asegurar que el índice no se salga de rango si la lista de fallos cambia
            if (currentIdx >= list.length) currentIdx = 0;

            const q = list[currentIdx];
            qText.innerText = q.q;
            qNumber.innerText = q.id;
            qTema.innerText = q.tema ? `Tema ${q.tema}: ${q.tema_title}` : '';
            const modeLabel = isRandomOrder ? '(ALEATORIO)' : '';
            const temaLabel = q.tema ? `Tema ${q.tema}` : '';
            statsEl.innerText = `${temaLabel} • Pregunta ${currentIdx + 1} de ${list.length} ${isReview ? '(MODO REPASO)' : ''} ${modeLabel}`.trim();

            
            container.innerHTML = '';
            ['a', 'b', 'c', 'd'].forEach(l => {
                if(!q[l]) return; // Por si alguna pregunta solo tiene 3 opciones
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 bg-white hover:border-indigo-300 transition-all flex gap-4 items-center group active:bg-slate-50";
                btn.innerHTML = `
                    <span class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-lg bg-slate-100 text-slate-500 group-hover:bg-indigo-100 font-bold text-sm uppercase">${l}</span>
                    <span class="text-slate-600 text-sm font-medium">${q[l]}</span>
                `;
                btn.onclick = () => check(l, q.correct, q.id, btn);
                container.appendChild(btn);
            });

            document.getElementById('bar').style.width = `${((currentIdx + 1) / list.length) * 100}%`;
        }

        function check(opt, correct, id, btn) {
            const btns = document.querySelectorAll('#options button');
            btns.forEach(b => b.onclick = null); // Bloquear clics extra

            if(opt === correct) {
                btn.classList.replace('border-slate-200', 'border-green-500');
                btn.classList.add('bg-green-50');
                streak++;
                // Si acertamos en modo repaso, quitar de la lista de fallos
                if(isReview) fails = fails.filter(f => f !== id);
            } else {
                btn.classList.replace('border-slate-200', 'border-red-500');
                btn.classList.add('bg-red-50');
                streak = 0;
                if(!fails.includes(id)) fails.push(id);
                
                // Mostrar la correcta
                btns.forEach(b => {
                    const letra = b.querySelector('span').innerText.toLowerCase();
                    if(letra === correct) {
                        b.classList.replace('border-slate-200', 'border-green-500');
                        b.classList.add('bg-green-50');
                    }
                });
            }
            
            localStorage.setItem('malaga_fails', JSON.stringify(fails));
            document.getElementById('streak').innerText = streak;
        }

        function toggleOrder() {
            isRandomOrder = !isRandomOrder;
            currentIdx = 0;
            randomList = [];
            const btn = document.getElementById('order-btn');
            btn.innerText = isRandomOrder ? "🎲 ALEATORIO" : "📋 ORDEN";
            btn.classList.toggle('bg-purple-600');
            btn.classList.toggle('text-white');
            btn.classList.toggle('bg-slate-100');
            btn.classList.toggle('text-slate-500');
            render();
        }

        function toggleReview() {
            isReview = !isReview;
            currentIdx = 0;
            randomList = [];
            const btn = document.getElementById('rev-btn');
            btn.innerText = isReview ? "REPASO: ON" : "REPASO: OFF";
            btn.classList.toggle('bg-indigo-600');
            btn.classList.toggle('text-white');
            btn.classList.toggle('bg-slate-100');
            btn.classList.toggle('text-slate-500');
            render();
        }

        function next() { 
            let list = isReview ? db.filter(q => fails.includes(q.id)) : db;
            if (isRandomOrder) {
                if (!randomList.length || randomList.length !== list.length) {
                    randomList = shuffleArray(list);
                }
                list = randomList;
            }
            if(currentIdx < list.length - 1) {
                currentIdx++; 
            } else {
                currentIdx = 0; // Volver al inicio
            }
            render(); 
        }

        function prev() { 
            if(currentIdx > 0) {
                currentIdx--; 
                render(); 
            }
        }

        function buildTemaList() {
            const temaList = document.getElementById('tema-list');
            
            // Fetch all temas (1-16) from temas.json
            fetch('temas.json')
                .then(r => r.json())
                .then(data => {
                    temaList.innerHTML = '';
                    data.temas.forEach(tema => {
                        const count = db.filter(q => q.tema === tema.id).length;
                        const isChecked = temaFilter === null || temaFilter.includes(tema.id);
                        const isAvailable = tema.hasQuestions;
                        
                        const label = document.createElement('label');
                        label.className = `flex items-center gap-3 p-3 bg-slate-50 rounded-lg cursor-pointer hover:bg-slate-100 transition ${!isAvailable ? 'opacity-50' : ''}`;
                        
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.className = 'tema-checkbox w-4 h-4';
                        checkbox.setAttribute('data-tema', tema.id);
                        checkbox.checked = isChecked && isAvailable;
                        checkbox.disabled = !isAvailable;
                        
                        const textDiv = document.createElement('div');
                        textDiv.className = 'flex-1 min-w-0';
                        textDiv.innerHTML = `
                            <div class="font-semibold text-slate-700 text-sm">Tema ${tema.id}${!isAvailable ? ' (sin preguntas)' : ''}</div>
                            <div class="text-xs text-slate-500 truncate">${tema.title.substring(0, 50)}...</div>
                            ${isAvailable ? `<div class="text-xs text-slate-400">${count} preguntas</div>` : ''}
                        `;
                        
                        label.appendChild(checkbox);
                        label.appendChild(textDiv);
                        temaList.appendChild(label);
                    });
                })
                .catch(err => console.error('Error loading temas.json:', err));
        }

        function openTemaConfig() {
            document.getElementById('tema-modal').classList.remove('hidden');
            updateTemaConfigUI();
        }

        function closeTemaConfig() {
            document.getElementById('tema-modal').classList.add('hidden');
        }

        function updateTemaConfigUI() {
            const checkboxes = document.querySelectorAll('.tema-checkbox');
            checkboxes.forEach(cb => {
                const temaNum = parseInt(cb.getAttribute('data-tema'));
                cb.checked = temaFilter === null || temaFilter.includes(temaNum);
            });
        }

        function selectAllTemas() {
            document.querySelectorAll('.tema-checkbox').forEach(cb => cb.checked = true);
        }

        function deselectAllTemas() {
            document.querySelectorAll('.tema-checkbox').forEach(cb => cb.checked = false);
        }

        function applyTemaFilter() {
            const selected = Array.from(document.querySelectorAll('.tema-checkbox:checked'))
                .map(cb => parseInt(cb.getAttribute('data-tema')))
                .sort((a, b) => a - b);
            
            // Filter to only temas with questions
            const temasWithQuestions = [1, 2, 3, 8, 13, 14, 15, 16];
            const selectedWithQuestions = selected.filter(t => temasWithQuestions.includes(t));
            
            if (selectedWithQuestions.length === 0) {
                alert('Debes seleccionar al menos un tema con preguntas');
                return;
            }
            
            // Check if all temas with questions are selected
            if (selectedWithQuestions.length === temasWithQuestions.length) {
                temaFilter = null; // All available temas
            } else {
                temaFilter = selectedWithQuestions;
            }
            
            localStorage.setItem('malaga_selected_temas', JSON.stringify(temaFilter));
            currentIdx = 0;
            randomList = [];
            closeTemaConfig();
            render();
        }
    </script>
</body>
</html>
